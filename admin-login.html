<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Access — Shahi Darbar</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Marcellus&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .restricted-shell{
    min-height:100svh; display:flex; align-items:center; justify-content:center; padding:2rem;
    background:
      radial-gradient(ellipse 50% 50% at 50% 0%, rgba(212,175,55,0.06), transparent 60%),
      var(--ink-900);
  }
  .restricted-card{ width:100%; max-width:380px; }
  .restricted-badge{
    display:flex; align-items:center; gap:10px; justify-content:center;
    color:var(--ivory-faint); font-size:0.66rem; letter-spacing:0.24em; text-transform:uppercase;
    margin-bottom:1.6rem;
  }
  .restricted-badge svg{ width:14px; height:14px; color:var(--gold); }
  .restricted-card h1{ text-align:center; font-size:2rem; color:var(--ivory); margin-bottom:0.5rem; }
  .restricted-card .sub{ text-align:center; color:var(--ivory-faint); font-size:0.85rem; margin-bottom:2.2rem; }
  .restricted-back{ display:flex; justify-content:center; margin-top:1.8rem; }
  .restricted-back a{ font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ivory-faint); }
  .restricted-back a:hover{ color:var(--gold-soft); }
</style>
</head>
<body>

<div class="grain"></div>
<div class="vignette"></div>

<div class="restricted-shell">
  <div class="restricted-card">
    <div class="restricted-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Restricted Access
    </div>
    <h1>Admin Panel</h1>
    <p class="sub">Authorised personnel only.</p>

    <div class="form-msg" id="adminMsg"></div>
    <form id="adminLoginForm">
      <div class="field">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" autocomplete="username" placeholder="admin email" required>
      </div>
      <div class="field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="adminLoginBtn">Enter Admin Panel</button>
    </form>

    <div class="restricted-back">
      <a href="index.html">← Back to Shahi Darbar</a>
    </div>
  </div>
</div>

<div id="toastStack"></div>

<script type="module">
  import { loginAdmin, showToast, waitForAuth, logoutUser } from "./js/auth.js";
  import { ADMIN_EMAIL } from "./js/firebase-config.js";

  // If already signed in as the admin account, skip straight to the panel.
  waitForAuth().then(user => {
    if (user && (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
      window.location.href = "admin.html";
    }
  });

  const form = document.getElementById("adminLoginForm");
  const msg = document.getElementById("adminMsg");
  const btn = document.getElementById("adminLoginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Verifying…";
    try {
      const email = document.getElementById("adminEmail").value;
      const password = document.getElementById("adminPassword").value;
      await loginAdmin(email, password);
      msg.textContent = "Access granted. Redirecting…";
      msg.className = "form-msg show success";
      showToast("Welcome, Admin.", "success");
      setTimeout(() => { window.location.href = "admin.html"; }, 500);
    } catch (err) {
      msg.textContent = err.message || "Invalid admin credentials.";
      msg.className = "form-msg show error";
      btn.disabled = false;
      btn.textContent = "Enter Admin Panel";
    }
  });
</script>

</body>
</html>
